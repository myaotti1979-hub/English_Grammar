/* ========== 集計の記録 ========== */
function bump(o,k,ok){const e=o[k]||(o[k]={n:0,c:0});e.n++;if(ok)e.c++;}
function pc(e){return e&&e.n?Math.round(e.c/e.n*100):null;}

/* 旧形式（days が数値）を新形式へ */
function migrate(){
  const d=S.stats.days||{};
  Object.keys(d).forEach(k=>{
    if(typeof d[k]==='number')d[k]={n:d[k],c:null};
  });
  S.cat=S.cat||{}; S.type=S.type||{};
}

const CATS=[
  ['main','時制・態','--clause-main'],
  ['sub','接続・比較','--clause-sub'],
  ['rel','関係詞・分詞','--clause-rel'],
  ['word','品詞・語法','--clause-word'],
  ['out','会話・作文','--clause-out']
];
const TYPES=[['mcq','四択'],['order','並べ替え'],['combine','文の合体'],
             ['speak','瞬間英作文'],['write','ライティング']];

/* ========== SVG 部品 ========== */
function heatmap(){
  const WEEKS=13, CELL=13, GAP=3.5, TOP=16;
  const today=new Date(); today.setHours(0,0,0,0);
  const end=new Date(today); end.setDate(end.getDate()+(6-end.getDay()));
  const cells=[]; let max=1;
  for(let i=WEEKS*7-1;i>=0;i--){
    const d=new Date(end); d.setDate(d.getDate()-i);
    const k=d.toLocaleDateString('sv-SE');
    const e=S.stats.days[k];
    const n=e?(typeof e==='number'?e:e.n):0;
    if(n>max)max=n;
    cells.push({d:d,k:k,n:n,future:d>today});
  }
  const W=WEEKS*(CELL+GAP), H=TOP+7*(CELL+GAP);
  let months='';
  let lastM=-1, lastW=-9;
  for(let w=0;w<WEEKS;w++){
    const first=cells[w*7];
    if(first.d.getMonth()!==lastM){
      lastM=first.d.getMonth();
      if(w-lastW>=3){ // 直前のラベルと重ならないときだけ描く
        months+=`<text x="${w*(CELL+GAP)}" y="10" class="hmm">${lastM+1}月</text>`;
        lastW=w;
      }
    }
  }
  const rects=cells.map((c,i)=>{
    const w=Math.floor(i/7), r=i%7;
    const x=w*(CELL+GAP), y=TOP+r*(CELL+GAP);
    if(c.future)return '';
    let fill='var(--line)';
    if(c.n>0){
      const t=Math.min(1,c.n/Math.max(6,max));
      fill=`rgba(47,75,153,${(0.25+t*0.75).toFixed(2)})`;
    }
    return `<rect x="${x}" y="${y}" width="${CELL}" height="${CELL}" rx="3" fill="${fill}"><title>${c.k} ${c.n}問</title></rect>`;
  }).join('');
  return `<svg viewBox="0 0 ${W} ${H}" class="hm" role="img" aria-label="学習カレンダー">
    <style>.hmm{font-family:var(--mono);font-size:8.5px;fill:var(--ink-3)}</style>
    ${months}${rects}</svg>`;
}

function radar(){
  const R=64, CX=124, CY=88;
  const vals=CATS.map(([k])=>{const v=pc(S.cat[k]); return {k:k,v:v};});
  const has=vals.some(v=>v.v!==null);
  const ang=i=>(-90+i*(360/CATS.length))*Math.PI/180;
  const pt=(i,r)=>[CX+Math.cos(ang(i))*r, CY+Math.sin(ang(i))*r];
  let grid='';
  [0.25,0.5,0.75,1].forEach(f=>{
    const p=CATS.map((_,i)=>pt(i,R*f).map(n=>n.toFixed(1)).join(',')).join(' ');
    grid+=`<polygon points="${p}" fill="none" stroke="var(--line)" stroke-width="1"/>`;
  });
  CATS.forEach((_,i)=>{
    const [x,y]=pt(i,R);
    grid+=`<line x1="${CX}" y1="${CY}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
  });
  const labels=CATS.map(([k,label],i)=>{
    const [x,y]=pt(i,R+16);
    const anchor=Math.abs(x-CX)<6?'middle':(x>CX?'start':'end');
    const v=vals[i].v;
    return `<text x="${x.toFixed(1)}" y="${(y+3).toFixed(1)}" text-anchor="${anchor}" class="rl">${label}</text>
            <text x="${x.toFixed(1)}" y="${(y+14).toFixed(1)}" text-anchor="${anchor}" class="rv">${v===null?'–':v+'%'}</text>`;
  }).join('');
  let shape='';
  if(has){
    const p=vals.map((v,i)=>pt(i,R*((v.v===null?0:v.v)/100)).map(n=>n.toFixed(1)).join(',')).join(' ');
    shape=`<polygon points="${p}" fill="rgba(47,75,153,.18)" stroke="var(--clause-main)" stroke-width="2" stroke-linejoin="round"/>`
      + vals.map((v,i)=>{if(v.v===null)return '';const [x,y]=pt(i,R*(v.v/100));
        return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3.5" fill="var(--clause-main)"/>`;}).join('');
  }
  return `<svg viewBox="0 0 248 186" class="radar" role="img" aria-label="分野別の正答率">
    <style>.rl{font-family:var(--ja);font-size:9px;fill:var(--ink-2)}
           .rv{font-family:var(--mono);font-size:10px;font-weight:600;fill:var(--ink)}</style>
    ${grid}${shape}${labels}</svg>`;
}

function trend(){
  const days=[];
  const t=new Date(); t.setHours(0,0,0,0);
  for(let i=13;i>=0;i--){
    const d=new Date(t); d.setDate(d.getDate()-i);
    const k=d.toLocaleDateString('sv-SE');
    const e=S.stats.days[k];
    const n=e?(typeof e==='number'?e:e.n):0;
    const c=e&&typeof e==='object'&&e.c!==null?e.c:null;
    days.push({k:k,n:n,r:(n&&c!==null)?Math.round(c/n*100):null});
  }
  const pts=days.map((d,i)=>({x:i,r:d.r})).filter(p=>p.r!==null);
  if(pts.length<2)return '';
  const W=280,H=90,PL=6,PR=6,PT=8,PB=16;
  const sx=i=>PL+(i/13)*(W-PL-PR);
  const sy=r=>PT+(1-r/100)*(H-PT-PB);
  const line=pts.map((p,i)=>`${i?'L':'M'}${sx(p.x).toFixed(1)},${sy(p.r).toFixed(1)}`).join(' ');
  const area=`${line} L${sx(pts[pts.length-1].x).toFixed(1)},${H-PB} L${sx(pts[0].x).toFixed(1)},${H-PB} Z`;
  const dots=pts.map(p=>`<circle cx="${sx(p.x).toFixed(1)}" cy="${sy(p.r).toFixed(1)}" r="2.6" fill="var(--clause-main)"><title>${days[p.x].k} ${p.r}%</title></circle>`).join('');
  return `<div class="h2">直近2週間の正答率</div><div class="card">
    <svg viewBox="0 0 ${W} ${H}" class="trend" role="img" aria-label="正答率の推移">
      <style>.tg{font-family:var(--mono);font-size:8px;fill:var(--ink-3)}</style>
      ${[0,50,100].map(v=>`<line x1="${PL}" y1="${sy(v).toFixed(1)}" x2="${W-PR}" y2="${sy(v).toFixed(1)}"
        stroke="var(--line)" stroke-width="1" stroke-dasharray="${v===50?'3 3':'0'}"/>`).join('')}
      <path d="${area}" fill="rgba(47,75,153,.10)"/>
      <path d="${line}" fill="none" stroke="var(--clause-main)" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round"/>${dots}
      <text x="${PL}" y="${H-4}" class="tg">14日前</text>
      <text x="${W-PR}" y="${H-4}" text-anchor="end" class="tg">今日</text>
    </svg></div>`;
}

/* ========== 診断 ========== */
function diagnose(){
  // 弱い単元：正答率が低く、かつ一定数解いている
  const rows=VU.map(u=>{
    const st=S.units[u.id]||{};
    const r=(st.n&&st.n>=3)?Math.round(st.c/st.n*100):null;
    return {u:u,r:r,n:st.n||0,best:st.best||0,wrong:S.wrong.filter(w=>w.u===u.id).length};
  });
  const done=rows.filter(r=>r.r!==null);
  const weak=done.filter(r=>r.r<75).sort((a,b)=>a.r-b.r);
  const untouched=rows.filter(r=>r.n===0);
  const cats=CATS.map(([k,label])=>({k:k,label:label,v:pc(S.cat[k]),n:(S.cat[k]||{}).n||0}))
                 .filter(c=>c.v!==null&&c.n>=5).sort((a,b)=>a.v-b.v);
  const types=TYPES.map(([k,label])=>({k:k,label:label,v:pc(S.type[k]),n:(S.type[k]||{}).n||0}))
                   .filter(t=>t.v!==null&&t.n>=3);
  return {rows:rows,weak:weak,untouched:untouched,cats:cats,types:types,done:done};
}

function nextAction(){
  const d=diagnose();
  if(!S.stats.total)
    return {t:'まずは1単元やってみましょう',
      b:'演習を解くと、分野ごとの得意・不得意がここに現れます。ユニット01から順に進めるのがおすすめです。',
      go:`<button class="btn sm" onclick="go('learn')">学ぶへ</button>`};
  const dueN=srsDue().length;
  if(dueN>=5)
    return {t:`今日の復習が ${dueN} 問あります`,
      b:'忘れかけたころに出し直す仕組みです。新しい単元より、まずここを空にするほうが定着します。',
      go:`<button class="btn sm" onclick="startQuiz('srs')">今日の復習</button>`};
  if(S.wrong.length>=10)
    return {t:`復習が ${S.wrong.length} 問たまっています`,
      b:'新しい単元に進むより、まず間違えた問題を消化するほうが伸びます。2回連続で正解すればリストから外れます。',
      go:`<button class="btn sm" onclick="startQuiz('review')">復習する</button>`};
  if(d.weak.length){
    const w=d.weak[0];
    return {t:`いちばんの弱点は「${w.u.title}」`,
      b:`正答率 ${w.r}%（${w.n}問中）。解説を読み直してから、この単元だけを続けて解くと定着します。`,
      go:`<button class="btn sm" onclick="openLesson('${w.u.id}')">解説を読む</button>
          <button class="btn ghost sm" onclick="startQuiz('unit','${w.u.id}')">この単元を解く</button>`};
  }
  const sp=S.type.speak;
  if(!sp||sp.n<20)
    return {t:'知識は足りています。次は出す練習を',
      b:'正答率は安定しています。ここからは瞬間英作文で、覚えた文法を口から出す速さを上げる段階です。',
      go:`<button class="btn sm" onclick="startQuiz('speak')">瞬間英作文</button>`};
  if((S.stats.mockBest||0)<90)
    return {t:'模試で仕上がりを確認しましょう',
      b:`模試の最高スコアは ${S.stats.mockBest||0}%。1問20秒のペースで解ききれるかが、900点帯の分かれ目です。`,
      go:`<button class="btn sm" onclick="startQuiz('mock')">模試を受ける</button>`};
  if(d.untouched.length)
    return {t:`未着手の単元が ${d.untouched.length} つあります`,
      b:`「${d.untouched[0].u.title}」から進めてみましょう。`,
      go:`<button class="btn sm" onclick="openLesson('${d.untouched[0].u.id}')">はじめる</button>`};
  return {t:'仕上がっています',
    b:'弱点は見当たりません。瞬間英作文とミックス演習を回して、精度と速さを保ちましょう。',
    go:`<button class="btn sm" onclick="startQuiz('mix')">ミックス演習</button>`};
}

/* ========== 較正：生成問題を実際に解いた結果でレベルを検証 ========== */
function calibTargets(){
  // 目標正答率の目安。
  // その帯を「ちょうど狙える」なら 65〜85% 付近に落ち着くはず。
  return {'800':[70,90],'900':[60,85],'990':[45,75]};
}
function calibView(){
  const cal=S.calib||{};
  const keys=Object.keys(LEVELS).filter(k=>cal[k]&&cal[k].n>=5);
  if(!keys.length)
    return `<div style="font-size:12.5px;color:var(--ink-2);line-height:1.9">
      AIで追加した問題を5問以上解くと、レベルごとの実際の正答率が出ます。
      指定したレベルが自分に合っていたかを、ここで確かめられます。</div>`;
  const tg=calibTargets();
  return keys.map(k=>{
    const e=cal[k], r=Math.round(e.c/e.n*100), [lo,hi]=tg[k];
    const verdict=r>hi?'この帯は易しすぎます。ひとつ上のレベルで作りましょう。'
      :r<lo?'この帯は難しすぎます。ひとつ下のレベルで土台を固めてから戻りましょう。'
      :'このレベルが今の実力にちょうど合っています。';
    const cls=r>hi?'easy':r<lo?'hard':'fit';
    return `<div class="cal">
      <div class="calh"><b>${LEVELS[k].label}</b>
        <span class="lvtag ${cls}">正答率 ${r}%</span></div>
      <div class="tr"><i style="width:${r}%;background:${
        cls==='fit'?'#0F8C7E':cls==='easy'?'#2F4B99':'#C13B54'}"></i>
        <u style="left:${lo}%;width:${hi-lo}%"></u></div>
      <div class="calb">${e.n}問を解答 ・ 目安 ${lo}〜${hi}%　${verdict}</div>
    </div>`;
  }).join('')+`<div class="tnote">帯の外に出たら、生成時の目標レベルを上げ下げしてください。
    これが最も信頼できる基準です。実際にあなたが解いた結果だからです。</div>`;
}

/* ========== 1. 音声読み上げ ========== */
const TTS={ready:false,en:null,ja:null,on:true,rate:0.95,auto:false};
function ttsInit(){
  if(!('speechSynthesis' in window))return;
  const pick=()=>{
    const vs=speechSynthesis.getVoices();
    if(!vs.length)return;
    // 英語は米国英語を優先。ローカル合成のほうが途切れにくい
    const en=vs.filter(v=>/^en(-|_)?/i.test(v.lang));
    TTS.en=en.find(v=>/en[-_]US/i.test(v.lang)&&v.localService)||
           en.find(v=>/en[-_]US/i.test(v.lang))||
           en.find(v=>v.localService)||en[0]||null;
    const ja=vs.filter(v=>/^ja/i.test(v.lang));
    TTS.ja=ja.find(v=>v.localService)||ja[0]||null;
    TTS.ready=!!TTS.en;
  };
  pick();
  speechSynthesis.onvoiceschanged=pick;
  if(S.tts){TTS.on=S.tts.on!==false;TTS.rate=S.tts.rate||0.95;TTS.auto=!!S.tts.auto;}
}
function ttsSave(){S.tts={on:TTS.on,rate:TTS.rate,auto:TTS.auto};save();}
function stripTags(s){return String(s||'').replace(/<[^>]*>/g,'').replace(/\s+/g,' ').trim();}
function speak(text,lang,cb){
  if(!TTS.on||!('speechSynthesis' in window)){if(cb)cb();return;}
  const t=stripTags(text).replace(/___/g,' blank ');
  if(!t){if(cb)cb();return;}
  try{
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(t);
    const v=lang==='ja'?TTS.ja:TTS.en;
    if(v)u.voice=v;
    u.lang=lang==='ja'?'ja-JP':'en-US';
    u.rate=lang==='ja'?1.0:TTS.rate;
    u.onend=()=>{if(cb)cb();};
    u.onerror=()=>{if(cb)cb();};
    speechSynthesis.speak(u);
  }catch(e){if(cb)cb();}
}
function speakStop(){try{speechSynthesis.cancel();}catch(e){}}
function speakBtn(text,lang){
  const id='sp'+Math.random().toString(36).slice(2,8);
  window[id]=()=>speak(text,lang||'en');

/* ========== 2. 間隔反復 ========== */
/* 間隔（日）。正解を重ねるほど間隔が伸びる。
   1回目=翌日, 2回目=3日後, 3回目=1週間後, 4回目=2週間後, 5回目=1か月後 */
const SRS_STEPS=[1,3,7,14,30,60];
function dayNum(d){return Math.floor((d||Date.now())/86400000);}
function srsKey(u,i){return u+':'+i;}
function srsGet(u,i){return (S.srs||{})[srsKey(u,i)]||null;}
function srsUpdate(u,i,ok){
  S.srs=S.srs||{};
  const k=srsKey(u,i);
  const cur=S.srs[k]||{s:0,due:0,seen:0};
  cur.seen=(cur.seen||0)+1;
  if(ok){
    cur.s=Math.min(SRS_STEPS.length-1,(cur.s||0)+1);
  }else{
    cur.s=0; // 間違えたら最初の間隔に戻す
  }
  cur.due=dayNum()+SRS_STEPS[cur.s];
  cur.last=dayNum();
  S.srs[k]=cur;
}
/* 今日復習すべき問題 */
function srsDue(){
  const t=dayNum(), out=[];
  Object.keys(S.srs||{}).forEach(k=>{
    const e=S.srs[k];
    if(!e||e.due>t)return;
    const p=k.split(':'), u=p[0], i=+p[1];
    const un=U(u);
    if(!un||!un.quiz[i])return;
    out.push({u:u,i:i,due:e.due,s:e.s});
  });
  // 期限を過ぎているものから順に
  out.sort((a,b)=>a.due-b.due);
  return out;
}
function srsSoon(){
  const t=dayNum();
  let d1=0,d7=0;
  Object.keys(S.srs||{}).forEach(k=>{
    const e=S.srs[k];if(!e)return;
    const diff=e.due-t;
    if(diff>0&&diff<=1)d1++;
    if(diff>0&&diff<=7)d7++;
  });
  return {tomorrow:d1,week:d7};
}
function srsMastered(){
  return Object.keys(S.srs||{}).filter(k=>(S.srs[k].s||0)>=4).length;
}

function logMiss(tag){
  const it=R.list[R.idx];
  S.miss=S.miss||{};
  S.miss[tag]=(S.miss[tag]||0)+1;
  S.missLog=S.missLog||[];
  S.missLog.push({d:today(),u:it.u,i:it.i,t:tag});
  if(S.missLog.length>400)S.missLog=S.missLog.slice(-400);
  save();
  const box=$('#missBox');
  if(box)box.innerHTML=`<div class="misdone">記録しました — ${MISS_TAGS.find(x=>x[0]===tag)[1]}</div>`;
}
function missPicker(){
  return `<div id="missBox"><div class="mistitle">なぜ間違えましたか（任意）</div>
    <div class="mistags">${MISS_TAGS.map(([k,l])=>
      `<button class="mistag" onclick="logMiss('${k}')">${l}</button>`).join('')}</div></div>`;
}
function missTop(){
  const m=S.miss||{};
  const rows=MISS_TAGS.map(([k,l])=>({k:k,l:l,n:m[k]||0})).filter(r=>r.n>0)
    .sort((a,b)=>b.n-a.n);
  return rows;
}

/* ========== 4. Part 6 の出題 ==========
   文書ごとの定義を、空所1つ＝1問に展開して通常の出題エンジンに載せる。
   これにより記録・間隔反復・復習の仕組みがそのまま使える。 */
function buildP6Unit(){
  const quiz=[];
  P6.forEach(doc=>{
    doc.blanks.forEach((bl,k)=>{
      const isSent=bl.c.some(x=>/[.!?]$/.test(String(x).trim())&&String(x).trim().split(' ').length>4);
      quiz.push({t:'p6',doc:doc.id,bi:k,
        c:bl.c,a:bl.a,why:bl.why,
        ja:isSent?'文脈に合う一文を選んでください':'空所に入る語を選んでください',
        sent:isSent});
    });
  });
  return {id:'p6',hidden:true,tag:'sub',tagLabel:'PART 6',sec:2,
    title:'Part 6 長文穴埋め',sub:'文脈から選ぶ',points:[],quiz:quiz};
}
function p6doc(id){return P6.find(d=>d.id===id);}
/* 文書を描く。解答済みの空所には正解を埋め、いま解く空所を強調する */
function p6render(doc,cur,revealed){
  const html=doc.body.map(par=>{
    let t=par.replace(/\n/g,'<br>');
    t=t.replace(/\{(\d)\}/g,(m,n)=>{
      const i=+n-1, bl=doc.blanks[i];
      if(i===cur){
        if(revealed!=null)
          return `<span class="p6cur done">${bl.c[bl.a]}</span>`;
        return `<span class="p6cur">${i+1}</span>`;
      }
      if(i<cur)return `<span class="p6fill">${bl.c[bl.a]}</span>`;
      return `<span class="p6blank">${i+1}</span>`;
    });
    return `<p>${t}</p>`;
  }).join('');
  return `<div class="p6doc"><div class="p6head">${doc.tag}　${doc.title}</div>${html}</div>`;
}

/* ========== 5. 振り返りメモ ========== */
function noteToday(){
  return (S.notes||[]).find(n=>n.d===today());
}
function saveNote(){
  const t=$('#noteText');if(!t)return;
  const v=t.value.trim();
  S.notes=S.notes||[];
  const i=S.notes.findIndex(n=>n.d===today());
  if(!v){if(i>-1)S.notes.splice(i,1);}
  else if(i>-1)S.notes[i].t=v;
  else S.notes.push({d:today(),t:v});
  if(S.notes.length>200)S.notes=S.notes.slice(-200);
  save();toast('保存しました');renderNotes();
}
function delNote(d){
  if(!confirm('このメモを削除します。よろしいですか？'))return;
  S.notes=(S.notes||[]).filter(n=>n.d!==d);save();renderNotes();
}
function renderNotes(){
  const cur=noteToday();
  const past=(S.notes||[]).filter(n=>n.d!==today()).sort((a,b)=>b.d.localeCompare(a.d));
  const miss=missTop();
  $('#notesBody').innerHTML=`
  <div class="card" style="margin-bottom:10px">
    <div style="font-weight:500;margin-bottom:4px">${new Date().toLocaleDateString('ja-JP',{month:'long',day:'numeric',weekday:'short'})}</div>
    <div style="font-size:12.5px;color:var(--ink-2);line-height:1.9;margin-bottom:12px">
      今日つまずいたこと、気づいたことを1行だけ残しておきましょう。
      数字では見えないことが、言葉にすると定着します。</div>
    ${miss.length?`<div class="hintline">今日の傾向：${miss[0].l}が最も多くなっています</div>`:''}
    <textarea class="wtext" id="noteText" style="min-height:92px"
      placeholder="例：due to のあとに文を続けてしまった。名詞句だけと覚え直す。">${cur?cur.t.replace(/</g,'&lt;'):''}</textarea>
    <div style="height:10px"></div>
    <button class="btn" onclick="saveNote()">保存する</button>
  </div>
  ${past.length?`<div class="h2">これまでのメモ</div>
    ${past.slice(0,40).map(n=>`<div class="note">
      <div class="noted">${n.d.slice(5).replace('-','/')}
        <button class="mini" onclick="delNote('${n.d}')">削除</button></div>
      <div class="notet">${n.t.replace(/</g,'&lt;').replace(/\n/g,'<br>')}</div>
    </div>`).join('')}`:''}
  <div style="height:10px"></div>`;
}

/* ========== 6. AI 添削 ========== */
const FB_SCHEMA={
  type:'object',
  properties:{
    score:{type:'integer',description:'100点満点の評価'},
    corrected:{type:'string',description:'自然な英文に直したもの'},
    good:{type:'string',description:'できている点。日本語で1〜2文'},
    issues:{type:'array',items:{
      type:'object',
      properties:{
        part:{type:'string',description:'問題のある箇所（原文からの短い引用）'},
        fix:{type:'string',description:'直した形'},
        why:{type:'string',description:'なぜそう直すのか。日本語で1〜2文'}
      },
      required:['part','fix','why'],
      propertyOrdering:['part','fix','why']
    }},
    advice:{type:'string',description:'次に気をつけること。日本語で1〜2文'}
  },
  required:['score','corrected','good','issues','advice'],
  propertyOrdering:['score','corrected','good','issues','advice']
};
function fbPrompt(q,text){
  return `あなたは日本人ビジネスパーソン向けの英語ライティング講師です。
学習者（TOEIC 800点台、CEFR B2）が書いた英文を添削してください。

【課題】${q.ja}
${q.src?`【与えられた条件】${q.src}`:''}
【模範解答の一例】${q.a}

【学習者の答案】
${text}

【添削の方針】
- 文法の誤りだけでなく、ビジネス英語として不自然な表現も指摘すること
- 模範解答と違っていても、英語として自然で課題を満たしていれば減点しない
- 指摘は多くても4点まで。重要な順に挙げること
- 些細な好みの違いは指摘しない
- 説明はすべて日本語で書くこと
- corrected には、学習者の書いた内容と構成をできるだけ残したまま、
  自然な英語に直したものを入れること（模範解答をそのまま返さない）
- score は 100点満点。文法の正確さ、語法の自然さ、課題への適合で判断する

日本語で、厳しすぎず、次にどうすればよいかが分かるように書いてください。`;
}
async function askFeedback(prompt){
  const key=gemKey();
  if(!key)throw new Error('APIキーが設定されていません');
  const url=`https://generativelanguage.googleapis.com/v1beta/models/${gemModel()}:generateContent?key=${encodeURIComponent(key)}`;
  const ctl=new AbortController();
  const timer=setTimeout(()=>ctl.abort(),90000);
  let res;
  try{
    res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl.signal,
      body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],
        generationConfig:{responseMimeType:'application/json',responseSchema:FB_SCHEMA,
          thinkingConfig:{thinkingLevel:gemThink()},maxOutputTokens:8192}})});
  }catch(e){
    if(e&&e.name==='AbortError')throw new Error('時間内に応答がありませんでした');
    throw new Error('通信に失敗しました');
  }finally{clearTimeout(timer);}
  if(!res.ok){
    let msg='';try{const j=await res.json();msg=(j.error&&j.error.message)||'';}catch(e){}
    if(res.status===400&&/API key/i.test(msg))throw new Error('APIキーが正しくありません');
    if(res.status===429)throw new Error('利用制限に達しました。しばらく待ってからお試しください');
    throw new Error(`添削できませんでした（${res.status}）`);
  }
  const data=await res.json();
  const cand=(data.candidates||[])[0];
  const txt=((cand&&cand.content&&cand.content.parts)||[]).map(p=>p.text||'').join('').trim();
  if(!txt)throw new Error('添削結果が空でした。もう一度お試しください');
  try{return JSON.parse(txt);}catch(e){throw new Error('添削結果を読み取れませんでした');}
}
async function runFeedback(){
  const ta=$('#wtext');
  const text=ta?ta.value.trim():'';
  if(!text){toast('先に英文を書いてください');return;}
  if(!gemKey()){
    $('#fbBox').innerHTML=`<div class="aimsg">添削にはGemini APIキーが必要です。
      <button class="linkbtn" onclick="go('aiset')">設定する</button></div>`;return;
  }
  const btn=$('#fbBtn');
  if(btn){btn.disabled=true;btn.textContent='添削しています…';}
  $('#fbBox').innerHTML=`<div class="aimsg">あなたの英文を読んでいます。20秒ほどかかります。
    <div class="prog"><i style="width:40%"></i></div></div>`;
  try{
    const q=R.list[R.idx].q;
    const fb=await askFeedback(fbPrompt(q,text));
    $('#fbBox').innerHTML=`
    <div class="fb">
      <div class="fbh"><span class="fbs">${Math.max(0,Math.min(100,fb.score))}<i>点</i></span>
        <span class="fbg">${fb.good||''}</span></div>
      ${(fb.issues||[]).length?`<div class="fbsec">直すとよい点</div>
        ${fb.issues.slice(0,4).map(x=>`<div class="fbi">
          <div class="fbfix"><s>${String(x.part).replace(/</g,'&lt;')}</s>
            <span>→</span><b>${String(x.fix).replace(/</g,'&lt;')}</b></div>
          <div class="fbw">${String(x.why).replace(/</g,'&lt;')}</div>
        </div>`).join('')}`:'<div class="fbsec">大きな誤りはありません</div>'}
      <div class="fbsec">自然な形に直すと</div>
      <div class="fbc">${String(fb.corrected).replace(/</g,'&lt;')}${speakBtn(fb.corrected,'en')}</div>
      <div class="fbadv">${String(fb.advice||'').replace(/</g,'&lt;')}</div>
    </div>`;
    S.fbCount=(S.fbCount||0)+1;save();
  }catch(e){
    $('#fbBox').innerHTML=`<div class="aimsg err">${e.message}</div>`;
  }finally{
    const b=$('#fbBtn');
    if(b){b.disabled=false;b.textContent='AIに添削してもらう';}
  }
}
