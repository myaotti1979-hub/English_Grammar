<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Syntax — ビジネス英文法トレーニング</title>
<meta name="theme-color" content="#17253F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Syntax">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="./icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

<style>
/* ============ tokens ============ */
:root{
  --ink:#17253F;         /* 主インク */
  --ink-2:#46587A;       /* 補助テキスト */
  --ink-3:#7C8AA5;       /* 微細ラベル */
  --paper:#E7EBF1;       /* 背景 */
  --card:#FFFFFF;
  --line:#D2D9E4;
  --clause-main:#2F4B99; /* 主節 */
  --clause-sub:#C07C12;  /* 従属節・接続表現 */
  --clause-rel:#0F8C7E;  /* 関係詞節 */
  --clause-word:#7A4A9E; /* 品詞・語法 */
  --clause-out:#9E4A34;  /* 会話・作文 */
  --wrong:#C13B54;
  --right:#0F8C7E;
  --r-lg:20px; --r-md:14px; --r-sm:9px;
  --pad:18px;
  --ja:'Noto Sans JP','Hiragino Kaku Gothic ProN','Hiragino Sans','Yu Gothic','Meiryo',sans-serif;
  --en:'Fraunces','Iowan Old Style','Times New Roman',serif;
  --mono:'JetBrains Mono','SFMono-Regular',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink);
  font-family:var(--ja); font-size:15px; line-height:1.75;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
/* ============ shell ============ */
#app{max-width:520px;margin:0 auto;min-height:100vh;min-height:100dvh;
  padding:0 var(--pad) calc(86px + env(safe-area-inset-bottom));}
.topbar{display:flex;align-items:baseline;gap:10px;
  padding:calc(18px + env(safe-area-inset-top)) 0 14px}
.wordmark{font-family:var(--en);font-weight:700;font-size:21px;letter-spacing:-.02em;
  font-variation-settings:'SOFT' 20,'WONK' 1}
.wordmark span{color:var(--clause-sub)}
.tagline{font-family:var(--mono);font-size:10px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase}
.screen{display:none;animation:fade .32s ease both}
.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ============ syntax underline : signature ============ */
.sent{font-family:var(--en);font-size:19px;line-height:2.5;font-weight:400;letter-spacing:-.005em}
.cl{position:relative;display:inline;padding-bottom:3px;
  background-image:linear-gradient(var(--c),var(--c));
  background-repeat:no-repeat;background-position:0 1.42em;
  background-size:0% 3px;animation:draw .5s cubic-bezier(.2,.7,.3,1) forwards}
.cl.main{--c:var(--clause-main)} .cl.sub{--c:var(--clause-sub)}
.cl.rel{--c:var(--clause-rel)} .cl.key{--c:var(--clause-sub);font-weight:600}
@keyframes draw{to{background-size:100% 3px}}
.cl.key{background-position:0 1.42em}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px}
.lg{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;
  letter-spacing:.06em;color:var(--ink-2)}
.lg i{width:16px;height:3px;border-radius:2px;background:var(--c)}
.lg.main{--c:var(--clause-main)}.lg.sub{--c:var(--clause-sub)}.lg.rel{--c:var(--clause-rel)}
.cl.word{--c:var(--clause-word)}
.cl.out{--c:var(--clause-out)}
.sect.three{border-color:var(--clause-out)}
.prompt{font-size:19px;font-weight:500;line-height:1.85;margin:6px 0 4px}
.srcbox{background:#F4F7FB;border-left:3px solid var(--clause-out);border-radius:0 var(--r-sm) var(--r-sm) 0;
  padding:12px 14px;margin:12px 0 16px;font-size:14px;line-height:1.8}
.srcbox .sl{font-family:var(--en);font-size:16px;line-height:1.6;display:block}
.srcbox .sl+.sl{margin-top:4px}
.hintchip{display:inline-block;font-family:var(--en);font-size:15px;font-weight:600;color:var(--clause-out);
  border:1.5px solid var(--clause-out);border-radius:20px;padding:3px 14px;margin-left:6px}
.wtext{width:100%;min-height:130px;border:1.5px solid var(--line);border-radius:var(--r-md);
  padding:13px;font-family:var(--en);font-size:16px;line-height:1.7;color:var(--ink);
  background:var(--card);resize:vertical;outline:none}
.wtext:focus{border-color:var(--ink)}
.chk{list-style:none;margin:10px 0 0;padding:0}
.chk li{font-size:12.5px;line-height:1.7;padding-left:20px;position:relative;margin-bottom:5px;color:var(--ink)}
.chk li::before{content:'';position:absolute;left:2px;top:.55em;width:9px;height:9px;
  border:1.5px solid var(--right);border-radius:2px}
.selfnote{font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:var(--ink-3);
  text-transform:uppercase;margin-bottom:9px;text-align:center}
.grade{display:flex;gap:7px}
.grade .btn{padding:13px 6px;font-size:13px}
.sect{margin:26px 0 11px;padding-left:11px;border-left:3px solid var(--clause-main)}
.sect b{display:block;font-size:14.5px;font-weight:700}
.sect span{display:block;font-size:11.5px;color:var(--ink-3);margin-top:1px}
.sect.two{border-color:var(--clause-word)}
#runTimer{font-family:var(--mono);font-size:13px;font-weight:600;
  padding:2px 10px;border-radius:20px;background:#DCE2EC}
#runTimer.low{background:#FBEDEF;color:var(--wrong)}
.note-lv{font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink-3)}

/* ============ cards ============ */
.card{background:var(--card);border-radius:var(--r-lg);padding:20px;
  box-shadow:0 1px 2px rgba(23,37,63,.06),0 8px 24px -14px rgba(23,37,63,.30)}
.hero{background:var(--ink);color:#F2F5F9;padding:22px 20px 20px;position:relative;overflow:hidden}
.hero .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;
  color:#8FA2C4;text-transform:uppercase;margin-bottom:14px;display:block}
.hero .sent{color:#F7F9FC}
.hero .ja{color:#9DAECB;font-size:12.5px;margin-top:10px;line-height:1.7}
.hero .lg{color:#9DAECB}

.h2{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:var(--ink-3);
  text-transform:uppercase;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
.h2::after{content:'';flex:1;height:1px;background:var(--line)}

/* ============ unit list ============ */
.unit{display:flex;gap:14px;align-items:center;width:100%;text-align:left;
  background:var(--card);border-radius:var(--r-md);padding:14px 16px;margin-bottom:9px;
  box-shadow:0 1px 2px rgba(23,37,63,.05);transition:transform .12s,box-shadow .12s}
.unit:active{transform:scale(.985)}
.unit .no{font-family:var(--mono);font-size:11px;color:var(--ink-3);width:20px;flex:none;padding-top:3px}
.unit .body{flex:1;min-width:0}
.unit .t{font-weight:500;font-size:14.5px;line-height:1.5}
.unit .s{font-size:11.5px;color:var(--ink-3);margin-top:2px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ring{width:34px;height:34px;flex:none;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;
  font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--ink-2)}
.tag{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;
  padding:2px 7px;border-radius:20px;border:1px solid var(--line);color:var(--ink-3);margin-right:5px}
.tag.t-main{color:var(--clause-main);border-color:#B9C6E6}
.tag.t-sub{color:var(--clause-sub);border-color:#EAD3A5}
.tag.t-rel{color:var(--clause-rel);border-color:#A8D8D1}
.tag.t-word{color:var(--clause-word);border-color:#D6C2E8}
.tag.t-out{color:var(--clause-out);border-color:#E8C4B6}

/* ============ buttons ============ */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
  background:var(--ink);color:#fff;border-radius:var(--r-md);padding:15px;
  font-weight:500;font-size:14.5px;transition:transform .12s,opacity .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink-2);border:1.5px solid var(--line)}
.btn.accent{background:var(--clause-sub)}
.btn[disabled]{opacity:.35}
.btn.sm{padding:11px;font-size:13px;border-radius:var(--r-sm)}
.row{display:flex;gap:9px}

/* ============ lesson ============ */
.navback{display:flex;align-items:center;gap:8px;padding:calc(16px + env(safe-area-inset-top)) 0 10px;
  font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--ink-3)}
.point{margin-bottom:12px}
.point .n{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.1em}
.point .rule{font-weight:500;font-size:14.5px;margin:4px 0 14px;line-height:1.65}
.point .ja{font-size:12.5px;color:var(--ink-2);margin-top:9px;line-height:1.7}
.point .note{font-size:12.5px;color:var(--ink-2);margin-top:12px;padding-top:12px;
  border-top:1px dashed var(--line);line-height:1.8}
.bad{color:var(--wrong);font-family:var(--en);font-size:15px}
.good{color:var(--right);font-family:var(--en);font-size:15px}
.pager{display:flex;gap:5px;margin:16px 0 14px}
.pager i{height:3px;flex:1;border-radius:2px;background:var(--line);transition:background .3s}
.pager i.on{background:var(--ink)}

/* ============ quiz ============ */
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;
  font-family:var(--mono);font-size:11px;color:var(--ink-3);letter-spacing:.08em}
.qbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-bottom:20px}
.qbar i{display:block;height:100%;background:var(--ink);transition:width .35s ease}
.qtext{font-family:var(--en);font-size:20px;line-height:1.95;margin-bottom:6px}
.blank{border-bottom:2.5px solid var(--clause-sub);padding:0 22px;display:inline-block}
.qja{font-size:12.5px;color:var(--ink-2);margin-bottom:18px}
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);
  border-radius:var(--r-md);padding:14px 16px;margin-bottom:9px;font-family:var(--en);font-size:17px;
  transition:border-color .15s,background .15s,transform .1s}
.opt:active{transform:scale(.99)}
.opt.pick{border-color:var(--ink);background:#F4F7FB}
.opt.ok{border-color:var(--right);background:#E9F5F2}
.opt.ng{border-color:var(--wrong);background:#FBEDEF}
.opt .mk{float:right;font-family:var(--mono);font-size:12px;font-weight:600}
.opt.ok .mk{color:var(--right)}.opt.ng .mk{color:var(--wrong)}

/* order drill */
.slot{min-height:74px;border-radius:var(--r-md);border:1.5px dashed var(--line);
  background:#F4F7FB;padding:10px;display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start;margin-bottom:14px}
.slot.done{border-style:solid}
.bank{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px}
.chip{font-family:var(--en);font-size:16px;padding:8px 13px;border-radius:var(--r-sm);
  background:var(--card);border:1.5px solid var(--line);line-height:1.3;transition:transform .1s,opacity .15s}
.chip:active{transform:scale(.94)}
.chip.used{opacity:.22;pointer-events:none}
.chip.in{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip.ok{background:#E9F5F2;border-color:var(--right);color:var(--right)}
.chip.ng{background:#FBEDEF;border-color:var(--wrong);color:var(--wrong)}

.verdict{border-radius:var(--r-md);padding:16px;margin-top:4px;animation:fade .3s ease both}
.verdict.ok{background:#E9F5F2;border-left:3px solid var(--right)}
.verdict.ng{background:#FBEDEF;border-left:3px solid var(--wrong)}
.verdict .vt{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;
  font-weight:600;margin-bottom:8px}
.verdict.ok .vt{color:var(--right)}.verdict.ng .vt{color:var(--wrong)}
.verdict .ans{font-family:var(--en);font-size:16.5px;line-height:1.6;margin-bottom:8px}
.verdict .why{font-size:13px;line-height:1.8;color:var(--ink)}
.sticky{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom));padding-top:12px}

/* ============ stats ============ */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.stat{background:var(--card);border-radius:var(--r-md);padding:15px}
.stat b{display:block;font-family:var(--mono);font-size:27px;font-weight:600;letter-spacing:-.02em}
.stat s{display:block;text-decoration:none;font-size:11px;color:var(--ink-3);margin-top:2px}
.bars{margin-top:6px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:11px}
.bar .lb{font-size:11.5px;color:var(--ink-2);width:96px;flex:none;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.bar .tr i{display:block;height:100%;background:var(--clause-main);border-radius:4px;transition:width .5s}
.bar .pc{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);width:34px;text-align:right}
.empty{text-align:center;padding:40px 20px;color:var(--ink-3);font-size:13px;line-height:1.9}
.empty .big{font-family:var(--en);font-size:38px;color:var(--line);display:block;margin-bottom:8px}

/* ============ tabbar ============ */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);display:flex;
  padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:520px;margin:0 auto;display:flex;width:100%}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  font-size:10.5px;color:var(--ink-3);padding:3px 0;position:relative}
.tab svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.7;
  stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--ink)}
.tab .dot{position:absolute;top:1px;right:calc(50% - 18px);min-width:16px;height:16px;
  border-radius:9px;background:var(--wrong);color:#fff;font-family:var(--mono);font-size:9.5px;
  display:grid;place-items:center;padding:0 4px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:24px;font-size:12.5px;
  z-index:60;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;white-space:nowrap}
.toast.on{opacity:1;transform:translate(-50%,-6px)}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .cl{background-size:100% 3px!important}}
</style>
</head>
<body>
<div id="app">
  <!-- ===== 学ぶ ===== -->
  <section class="screen on" id="s-learn">
    <div class="topbar">
      <div class="wordmark">Syn<span>tax</span></div>
      <div class="tagline">Business grammar · B1→B2</div>
    </div>
    <div class="card hero">
      <span class="eyebrow" id="heroLabel">今日の一文</span>
      <div class="sent" id="heroSent"></div>
      <div class="ja" id="heroJa"></div>
      <div class="legend">
        <span class="lg main"><i></i>主節</span>
        <span class="lg sub"><i></i>接続・従属節</span>
        <span class="lg rel"><i></i>関係詞節</span>
      </div>
    </div>
    <div style="margin-top:10px" id="resumeWrap"></div>
    <div class="h2">23ユニット・240問</div>
    <div id="unitList"></div>
    <div style="height:10px"></div>
  </section>

  <!-- ===== レッスン ===== -->
  <section class="screen" id="s-lesson">
    <button class="navback" onclick="go('learn')">← ユニット一覧</button>
    <div id="lessonHead"></div>
    <div class="pager" id="lessonPager"></div>
    <div id="lessonBody"></div>
    <div class="sticky"><div class="row" id="lessonNav"></div></div>
  </section>

  <!-- ===== 演習 ===== -->
  <section class="screen" id="s-quiz">
    <div class="topbar">
      <div class="wordmark">演習</div>
      <div class="tagline">Practice</div>
    </div>
    <div id="quizMenu"></div>
  </section>

  <!-- ===== 出題中 ===== -->
  <section class="screen" id="s-run">
    <button class="navback" id="runBack">← 中断する</button>
    <div class="qhead"><span id="runTitle"></span><span id="runTimer" hidden></span><span id="runCount"></span></div>
    <div class="qbar"><i id="runBar" style="width:0"></i></div>
    <div id="runBody"></div>
    <div class="sticky" id="runFoot"></div>
  </section>

  <!-- ===== 復習 ===== -->
  <section class="screen" id="s-review">
    <div class="topbar">
      <div class="wordmark">復習</div>
      <div class="tagline">Weak points</div>
    </div>
    <div id="reviewBody"></div>
  </section>

  <!-- ===== 記録 ===== -->
  <section class="screen" id="s-stats">
    <div class="topbar">
      <div class="wordmark">記録</div>
      <div class="tagline">Progress</div>
    </div>
    <div id="statsBody"></div>
  </section>
</div>

<nav class="tabbar"><div class="in">
  <button class="tab on" data-go="learn"><svg viewBox="0 0 24 24"><path d="M4 5.5A1.5 1.5 0 015.5 4H10a2 2 0 012 2v13a2 2 0 00-2-2H5.5A1.5 1.5 0 014 15.5z"/><path d="M20 5.5A1.5 1.5 0 0018.5 4H14a2 2 0 00-2 2v13a2 2 0 012-2h4.5a1.5 1.5 0 001.5-1.5z"/></svg>学ぶ</button>
  <button class="tab" data-go="quiz"><svg viewBox="0 0 24 24"><path d="M9 11l2.5 2.5L20 5"/><path d="M20 12v6a2 2 0 01-2 2H6a2 2 0 01-2-2V6a2 2 0 012-2h9"/></svg>演習</button>
  <button class="tab" data-go="review"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9 9 0 00-6.4 2.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7.5V12l3 2"/></svg>復習<span class="dot" id="reviewDot" hidden>0</span></button>
  <button class="tab" data-go="stats"><svg viewBox="0 0 24 24"><path d="M4 20V10"/><path d="M10 20V4"/><path d="M16 20v-7"/><path d="M22 20H2"/></svg>記録</button>
</div></nav>
<div class="toast" id="toast"></div>
<script>
/* 構文マーク: [[text|main|sub|rel|key]] */
const UNITS = [
{
 id:'u1', tag:'main', tagLabel:'TENSE',
 title:'現在形と現在進行形',
 sub:'事実・習慣 vs いま起きていること',
 points:[
  {rule:'現在形＝いつも変わらない事実・仕組み・習慣',
   en:'Our team [[handles|key]] all overseas shipping.',
   ja:'当社のチームが海外発送をすべて担当しています。',
   note:'会社の役割、業務プロセス、契約内容など「基本的にそうなっている」ことは現在形。every week / usually / normally と相性がよい。'},
  {rule:'現在進行形＝いま／この期間だけの一時的な状態',
   en:'I [[am covering|key]] for Ken [[while he is on leave|sub]].',
   ja:'ケンが休暇の間、私が代わりを務めています。',
   note:'「ふだんは違うけれど、今はこう」というときは進行形。this week / at the moment / for now が目印。'},
  {rule:'状態を表す動詞は進行形にしない',
   en:'I [[understand|key]] your concern, and we [[need|key]] more time.',
   ja:'ご懸念は理解しています。もう少し時間が必要です。',
   note:'know / understand / believe / need / want / agree / own / contain などは進行形にしない。<span class="bad">✕ I am understanding</span> → <span class="good">◯ I understand</span>'},
  {rule:'進行形は「変化・傾向」も表せる',

<script>
/* ========== storage : artifact / PWA / memory の順に自動選択 ========== */
const KEY='syntax.v1';
let S={units:{},wrong:[],stats:{total:0,correct:0,days:{}},last:null};
const mem={};
const io={
  async get(){
    try{ if(window.storage){const r=await window.storage.get(KEY,false);return r?r.value:null;} }catch(e){}
    try{ return localStorage.getItem(KEY); }catch(e){}
    return mem[KEY]||null;
  },
  async set(v){
    try{ if(window.storage){await window.storage.set(KEY,v,false);return;} }catch(e){}
    try{ localStorage.setItem(KEY,v);return; }catch(e){}
    mem[KEY]=v;
  }
};
let saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>io.set(JSON.stringify(S)),200);}
async function load(){
  const raw=await io.get();
  if(raw){try{const p=JSON.parse(raw);S=Object.assign(S,p);
    S.stats=Object.assign({total:0,correct:0,days:{}},p.stats||{});}catch(e){}}
}
const today=()=>new Date().toLocaleDateString('sv-SE');

/* ========== helpers ========== */
const $=s=>document.querySelector(s);
const el=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstElementChild;};
function mark(t){return t.replace(/\[\[(.+?)\|(main|sub|rel|key)\]\]/g,(m,a,b)=>`<span class="cl ${b}">${a}</span>`);}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');
  clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1800);}
function updateDot(){const n=S.wrong.length,d=$('#reviewDot');
  if(!d)return;d.hidden=n===0;d.textContent=n>99?'99+':n;}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;}
const U=id=>UNITS.find(u=>u.id===id);
const VU=UNITS.filter(u=>!u.hidden);
function unitRow(u,i,fn,sub){const st=uStat(u.id);
  return `<button class="unit" onclick="${fn}('${u.id}')">
    <span class="no">${String(i+1).padStart(2,'0')}</span>
    <span class="body"><span class="t">${u.title}</span>
      <span class="s"><span class="tag t-${u.tag}">${u.tagLabel}</span>${sub||u.sub}</span></span>
    ${ring(st.best)}</button>`;}
function unitListHTML(fn,withCount){
  let out='';
  VU.forEach((u,i)=>{
    if(i===0)out+='<div class="sect"><b>土台をつくる</b><span>時制・接続・関係詞を口から出せるようにする</span></div>';
    if((u.sec||1)===2&&(VU[i-1]&&(VU[i-1].sec||1)===1))
      out+='<div class="sect two"><b>900点への精度</b><span>Part 5 で差がつく品詞・語法・一致・倒置</span></div>';
    if((u.sec||1)===3&&(VU[i-1]&&(VU[i-1].sec||1)===2))
      out+='<div class="sect three"><b>話す・書くに変える</b><span>覚えた文法を、口と手から出せるようにする</span></div>';
    out+=unitRow(u,i,fn,withCount?`${u.quiz.length}問 ・ ${uStat(u.id).best?'最高 '+uStat(u.id).best+'%':'未挑戦'}`:null);
  });
  return out;}
function startUnitQuiz(id){startQuiz('unit',id);}
function uStat(id){const s=S.units[id]||{};return {seen:!!s.seen,best:s.best||0,done:s.done||0};}

/* ========== nav ========== */
let cur='learn';
function go(name){
  if(typeof stopTimer==='function'&&name!=='run')stopTimer();
  cur=name;
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id==='s-'+name));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.go===name));
  window.scrollTo(0,0);
  if(name==='learn')renderLearn();
  if(name==='quiz')renderQuizMenu();
  if(name==='review')renderReview();
  if(name==='stats')renderStats();
}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>go(t.dataset.go));

/* ========== 学ぶ ========== */
function ring(pc){
  const r=15,c=2*Math.PI*r,off=c*(1-pc/100);
  return `<div class="ring"><svg width="34" height="34" viewBox="0 0 34 34">
    <circle cx="17" cy="17" r="${r}" stroke="#D2D9E4" stroke-width="3" fill="none"/>
    <circle cx="17" cy="17" r="${r}" stroke="${pc>=80?'#0F8C7E':'#2F4B99'}" stroke-width="3" fill="none"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"/>
  </svg><b>${pc?pc:'–'}</b></div>`;
}
function renderLearn(){
  const h=HERO[(new Date().getDate()+new Date().getMonth())%HERO.length];
  $('#heroSent').innerHTML=mark(h.en);
  $('#heroJa').textContent=h.ja;
  $('#unitList').innerHTML=unitListHTML('openLesson');
  const rw=$('#resumeWrap');
  if(S.last&&U(S.last.u)){
    rw.innerHTML=`<button class="btn accent" onclick="openLesson('${S.last.u}',${S.last.p})">
      続きから — ${U(S.last.u).title}</button>`;
  }else{rw.innerHTML=`<button class="btn" onclick="openLesson('u1')">はじめる — 01 現在形と現在進行形</button>`;}
  updateDot();
}

/* ========== レッスン ========== */
let L={u:null,p:0};
function openLesson(id,p=0){
  const uu=U(id);if(!uu||!uu.points.length){toast('このユニットに解説ページはありません');return;}
  L={u:id,p:p};S.last={u:id,p:p};
  S.units[id]=Object.assign({seen:true},S.units[id]);save();
  go('lesson');paintLesson();
}
function paintLesson(){
  const u=U(L.u),pt=u.points[L.p];
  $('#lessonHead').innerHTML=`<div style="margin-bottom:14px">
    <div class="tag t-${u.tag}" style="margin-bottom:6px">${u.tagLabel}</div>
    <div style="font-size:19px;font-weight:700;line-height:1.5">${u.title}</div>
    <div style="font-size:12px;color:var(--ink-3)">${u.sub}</div></div>`;
  $('#lessonPager').innerHTML=u.points.map((_,i)=>`<i class="${i<=L.p?'on':''}"></i>`).join('');
  $('#lessonBody').innerHTML=`<div class="card point">
    <div class="n">POINT ${L.p+1} / ${u.points.length}</div>
    <div class="rule">${pt.rule}</div>
    ${pt.en?`<div class="sent">${mark(pt.en)}</div>`:''}
    ${pt.ja?`<div class="ja">${pt.ja}</div>`:''}
    ${pt.note?`<div class="note">${pt.note}</div>`:''}
  </div>`;
  const last=L.p===u.points.length-1;
  $('#lessonNav').innerHTML=
    `${L.p>0?'<button class="btn ghost" onclick="stepLesson(-1)">戻る</button>':''}
     ${last?`<button class="btn accent" onclick="startQuiz('unit','${u.id}')">このユニットを演習する</button>`
           :'<button class="btn" onclick="stepLesson(1)">次へ</button>'}`;
  window.scrollTo({top:0,behavior:'smooth'});
}
function stepLesson(d){
  const u=U(L.u);L.p=Math.max(0,Math.min(u.points.length-1,L.p+d));
  S.last={u:L.u,p:L.p};save();paintLesson();
}

/* ========== 演習メニュー ========== */
function renderQuizMenu(){
  $('#quizMenu').innerHTML=`
  <div class="card" style="margin-bottom:10px;border-left:3px solid var(--clause-out)">
    <div style="font-weight:500;margin-bottom:4px">瞬間英作文 <span class="note-lv">12問 / 声に出す</span></div>
    <div style="font-size:12.5px;color:var(--ink-2);line-height:1.8;margin-bottom:14px">
      日本語を見て、英語を口に出してから答えを確認します。会話で文が途切れるのは、知識ではなく取り出す速さの問題です。ここが本番に一番近い練習になります。</div>
    <button class="btn" onclick="startQuiz('speak')">声に出して始める</button>
  </div>
  <div class="card" style="margin-bottom:10px;border-left:3px solid var(--clause-out)">
    <div style="font-weight:500;margin-bottom:4px">ライティング課題 <span class="note-lv">3問 / 自己採点</span></div>
    <div style="font-size:12.5px;color:var(--ink-2);line-height:1.8;margin-bottom:14px">
      メールや報告を実際に書いてから、模範解答とチェック項目で自己採点します。書ける型は、そのまま会話でも使えます。</div>
    <button class="btn ghost" onclick="startQuiz('write')">書いて始める</button>
  </div>
  <div class="card" style="margin-bottom:10px;border-left:3px solid var(--clause-word)">
    <div style="font-weight:500;margin-bottom:4px">Part 5 模試 <span class="note-lv">20問 / 6分40秒</span></div>
    <div style="font-size:12.5px;color:var(--ink-2);line-height:1.8;margin-bottom:14px">
      本番と同じ1問20秒ペースで20問。全ユニットと模試専用問題から出題します。900点帯では、解けることに加えて速く解けることが必要です。</div>
    <button class="btn accent" onclick="startQuiz('mock')">模試を始める</button>
    ${S.stats.mockBest?`<div style="font-family:var(--mono);font-size:11px;color:var(--ink-3);text-align:center;margin-top:10px">BEST ${S.stats.mockBest}%</div>`:''}
  </div>
  <div class="card" style="margin-bottom:10px">
    <div style="font-weight:500;margin-bottom:4px">ミックス演習</div>
    <div style="font-size:12.5px;color:var(--ink-2);line-height:1.8;margin-bottom:14px">
      全ユニットから10問をランダム出題。実際の会話では文法は混ざって出てくるので、混ぜて解く練習が効きます。</div>
    <button class="btn" onclick="startQuiz('mix')">10問を始める</button>
  </div>
  <div class="card" style="margin-bottom:10px">
    <div style="font-weight:500;margin-bottom:4px">弱点集中</div>
    <div style="font-size:12.5px;color:var(--ink-2);line-height:1.8;margin-bottom:14px">
      正答率の低いユニットから優先的に出題します。</div>
    <button class="btn ghost" onclick="startQuiz('weak')">弱点10問を始める</button>
  </div>
  <div class="h2">ユニット別</div>
  ${unitListHTML('startUnitQuiz',true)}
  <div style="height:10px"></div>`;
}

/* ========== 出題エンジン ========== */
let R=null;
function qref(u,i){return {u:u,i:i,q:U(u).quiz[i]};}
function startQuiz(mode,uid){
  let list=[],title='';
  if(mode==='unit'){const u=U(uid);title=u.title;list=u.quiz.map((_,i)=>qref(uid,i));}
  else if(mode==='mix'){title='ミックス演習';
    VU.forEach(u=>u.quiz.forEach((_,i)=>list.push(qref(u.id,i))));list=shuffle(list).slice(0,10);}
  else if(mode==='speak'){title='瞬間英作文';
    UNITS.forEach(u=>u.quiz.forEach((q,i)=>{if(q.t==='speak')list.push(qref(u.id,i));}));
    list=shuffle(list).slice(0,12);}
  else if(mode==='write'){title='ライティング';
    UNITS.forEach(u=>u.quiz.forEach((q,i)=>{if(q.t==='write')list.push(qref(u.id,i));}));
    list=shuffle(list).slice(0,3);}
  else if(mode==='mock'){title='Part 5 模試';
    UNITS.forEach(u=>u.quiz.forEach((q,i)=>{if(q.t==='mcq')list.push(qref(u.id,i));}));
    list=shuffle(list).slice(0,20);}
  else if(mode==='weak'){title='弱点集中';
    const sc=VU.map(u=>({u:u,s:uStat(u.id).best||0}));sc.sort((a,b)=>a.s-b.s);
    sc.slice(0,4).forEach(x=>x.u.quiz.forEach((_,i)=>list.push(qref(x.u.id,i))));
    list=shuffle(list).slice(0,10);}
  else if(mode==='review'){title='復習';
    list=shuffle(S.wrong.map(w=>qref(w.u,w.i)).filter(x=>x.q)).slice(0,12);}
  if(!list.length){toast('出題できる問題がありません');return;}
  R={mode,uid,title,list,idx:0,correct:0,answered:false,pick:null,built:[]};
  go('run');paintQ();
  if(mode==='mock')startTimer(list.length*20);
}
$('#runBack').onclick=()=>{if(R&&R.mode==='unit')go('learn');else if(R&&R.mode==='review')go('review');else go('quiz');};

function paintQ(){
  const it=R.list[R.idx],q=it.q;
  R.answered=false;R.pick=null;R.built=[];
  $('#runTitle').textContent=R.title;
  $('#runCount').textContent=`${R.idx+1} / ${R.list.length}`;
  $('#runBar').style.width=(R.idx/R.list.length*100)+'%';
  R.graded=false;
  if(q.t==='speak'){
    $('#runBody').innerHTML=`
      <div class="qja">日本語を見て、英語で声に出してみましょう</div>
      <div class="prompt">${q.ja}</div>
      <div id="verdict"></div>`;
    paintFoot();return;
  }
  if(q.t==='write'){
    $('#runBody').innerHTML=`
      <div class="qja" style="font-size:14px;color:var(--ink);line-height:1.8">${q.ja}</div>
      ${q.src?`<div class="srcbox">${q.src}</div>`:''}
      <textarea class="wtext" id="wtext" placeholder="ここに英文を書いてみましょう"></textarea>
      <div id="verdict"></div>`;
    paintFoot();return;
  }
  if(q.t==='mcq'){
    R.order=shuffle(q.c.map((c,i)=>({c,i})));
    $('#runBody').innerHTML=`
      <div class="qtext">${q.q.replace('___','<span class="blank"></span>')}</div>
      <div class="qja">${q.ja}</div>
      <div id="opts">${R.order.map((o,n)=>
        `<button class="opt" data-n="${n}" onclick="pick(${n})">${o.c}</button>`).join('')}</div>
      <div id="verdict"></div>`;
  }else{
    R.bank=shuffle(q.a.map((w,i)=>({w,i})));
    $('#runBody').innerHTML=`
      ${q.t==='combine'?`<div class="qja">次の2文を <span class="hintchip">${q.hint}</span> を使って1文にしてください</div>
        <div class="srcbox">${q.src.map(s=>`<span class="sl">${s}</span>`).join('')}</div>`:''}
      <div class="qja" style="font-size:14px;color:var(--ink);margin-bottom:14px">${q.ja}</div>
      <div class="slot" id="slot"></div>
      <div class="bank" id="bank">${R.bank.map((b,n)=>
        `<button class="chip" data-n="${n}" onclick="tapChip(${n})">${b.w}</button>`).join('')}</div>
      <div id="verdict"></div>`;
    paintSlot();
  }
  paintFoot();
}
function paintFoot(){
  const last=R.idx===R.list.length-1,q=R.list[R.idx].q,self=(q.t==='speak'||q.t==='write');
  const nextBtn=`<button class="btn" onclick="nextQ()">${last?'結果を見る':'次の問題へ'}</button>`;
  if(self){
    if(!R.answered){
      $('#runFoot').innerHTML=`<button class="btn" onclick="reveal()">${q.t==='speak'?'言えたら模範解答を見る':'書けたら模範解答を見る'}</button>`;
    }else if(!R.graded){
      $('#runFoot').innerHTML=`<div class="selfnote">自己採点してください</div><div class="grade">
        ${q.t==='speak'
          ?`<button class="btn ghost" onclick="grade(0)">出てこなかった</button>
            <button class="btn ghost" onclick="grade(0)">つまずいた</button>
            <button class="btn" onclick="grade(1)">言えた</button>`
          :`<button class="btn ghost" onclick="grade(0)">直しが必要</button>
            <button class="btn" onclick="grade(1)">書けていた</button>`}</div>`;
    }else{$('#runFoot').innerHTML=nextBtn;}
    return;
  }
  if(!R.answered){
    const ready=q.t==='mcq'?R.pick!==null:R.built.length===q.a.length;
    $('#runFoot').innerHTML=`<button class="btn" id="chk" ${ready?'':'disabled'} onclick="check()">答え合わせ</button>`;
  }else{$('#runFoot').innerHTML=nextBtn;}
}
function reveal(){
  const q=R.list[R.idx].q;
  $('#verdict').innerHTML=`<div class="verdict ok">
    <div class="vt">模範解答</div>
    <div class="ans sent" style="line-height:1.75">${mark(q.a)}</div>
    ${q.check?`<ul class="chk">${q.check.map(c=>`<li>${c}</li>`).join('')}</ul>`:''}
    <div class="why" style="margin-top:10px">${q.why}</div></div>`;
  R.answered=true;R.graded=false;paintFoot();
  $('#verdict').scrollIntoView({behavior:'smooth',block:'center'});
}
function grade(ok){R.graded=true;record(R.list[R.idx],!!ok);paintFoot();}
function pick(n){
  if(R.answered)return;R.pick=n;
  document.querySelectorAll('#opts .opt').forEach(b=>b.classList.toggle('pick',+b.dataset.n===n));
  paintFoot();
}
function paintSlot(){
  const s=$('#slot');
  s.innerHTML=R.built.map((n,k)=>`<button class="chip in" onclick="unTap(${k})">${R.bank[n].w}</button>`).join('')
    ||`<span style="font-size:12px;color:var(--ink-3);align-self:center">下の語を順番にタップして英文をつくる</span>`;
  document.querySelectorAll('#bank .chip').forEach(b=>b.classList.toggle('used',R.built.includes(+b.dataset.n)));
}
function tapChip(n){if(R.answered||R.built.includes(n))return;R.built.push(n);paintSlot();paintFoot();}
function unTap(k){if(R.answered)return;R.built.splice(k,1);paintSlot();paintFoot();}

function check(){
  const it=R.list[R.idx],q=it.q;let ok=false,mine='';
  if(q.t==='mcq'){
    ok=R.order[R.pick].i===q.a;
    document.querySelectorAll('#opts .opt').forEach(b=>{
      const n=+b.dataset.n,isA=R.order[n].i===q.a;
      b.classList.remove('pick');
      if(isA){b.classList.add('ok');b.insertAdjacentHTML('afterbegin','<span class="mk">正解</span>');}
      else if(n===R.pick){b.classList.add('ng');b.insertAdjacentHTML('afterbegin','<span class="mk">選択</span>');}
    });
  }else{
    mine=R.built.map(n=>R.bank[n].w);
    ok=mine.join(' ')===q.a.join(' ');
    $('#slot').classList.add('done');
    $('#slot').querySelectorAll('.chip').forEach((c,k)=>{
      c.classList.remove('in');c.classList.add(mine[k]===q.a[k]?'ok':'ng');});
  }
  const answer=q.t==='mcq'
    ? q.q.replace('___',`<b style="color:var(--clause-sub)">${q.c[q.a]}</b>`)
    : (q.full||q.a.join(' ')+'.');
  $('#verdict').innerHTML=`<div class="verdict ${ok?'ok':'ng'}">
    <div class="vt">${ok?'正解':'もう一度確認'}</div>
    <div class="ans">${answer}</div>
    <div class="why">${q.why}</div></div>`;
  R.answered=true;record(it,ok);paintFoot();
  if(!ok)$('#verdict').scrollIntoView({behavior:'smooth',block:'center'});
}
function record(it,ok){
  S.stats.total++;if(ok){S.stats.correct++;R.correct++;}
  const d=today();S.stats.days[d]=(S.stats.days[d]||0)+1;
  const w=S.wrong.findIndex(x=>x.u===it.u&&x.i===it.i);
  if(ok){if(w>-1){S.wrong[w].n=(S.wrong[w].n||0)+1;if(S.wrong[w].n>=2)S.wrong.splice(w,1);}}
  else{if(w>-1)S.wrong[w].n=0;else S.wrong.push({u:it.u,i:it.i,n:0});}
  save();updateDot();
}
function nextQ(){
  if(R.idx<R.list.length-1){R.idx++;paintQ();window.scrollTo({top:0,behavior:'smooth'});return;}
  finish();
}
function finish(){
  const pc=Math.round(R.correct/R.list.length*100);
  stopTimer();
  if(R.mode==='mock'){S.stats.mockBest=Math.max(S.stats.mockBest||0,pc);save();}
  if(R.mode==='unit'){
    const st=S.units[R.uid]||{};st.best=Math.max(st.best||0,pc);st.done=(st.done||0)+1;st.seen=true;
    S.units[R.uid]=st;save();
  }
  $('#runBar').style.width='100%';
  $('#runCount').textContent='完了';
  $('#runBody').innerHTML=`<div class="card" style="text-align:center;padding:32px 20px">
    <div style="font-family:var(--mono);font-size:11px;letter-spacing:.14em;color:var(--ink-3)">SCORE</div>
    <div style="font-family:var(--mono);font-size:52px;font-weight:600;letter-spacing:-.03em;line-height:1.2">${pc}<span style="font-size:22px">%</span></div>
    <div style="font-size:13px;color:var(--ink-2)">${R.list.length}問中 ${R.correct}問 正解</div>
    ${R.mode==='mock'?`<div style="font-size:12.5px;color:var(--ink);margin-top:14px;line-height:1.8;
      padding-top:14px;border-top:1px solid var(--line);text-align:left">${mockComment(pc)}</div>`:''}
    ${S.wrong.length?`<div style="font-size:12.5px;color:var(--ink-2);margin-top:16px;line-height:1.8">
      間違えた問題は復習リストに入りました。<br>2回連続で正解するとリストから外れます。</div>`:''}
  </div>`;
  $('#runFoot').innerHTML=`<div class="row">
    <button class="btn ghost" onclick="startQuiz('${R.mode}','${R.uid||''}')">もう一度</button>
    ${S.wrong.length?`<button class="btn" onclick="startQuiz('review')">復習する（${S.wrong.length}）</button>`
      :`<button class="btn" onclick="go('learn')">ユニットに戻る</button>`}</div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ========== 模試タイマー ========== */
let timerId=null;
function startTimer(sec){stopTimer();R.left=sec;$('#runTimer').hidden=false;paintTimer();
  timerId=setInterval(()=>{R.left--;paintTimer();if(R.left<=0){stopTimer();toast('時間切れです');finish();}},1000);}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}
  const t=$('#runTimer');if(t)t.hidden=true;}
function paintTimer(){const t=$('#runTimer');if(!t)return;
  const m=Math.floor(Math.max(R.left,0)/60),s=Math.max(R.left,0)%60;
  t.textContent=m+':'+String(s).padStart(2,'0');t.classList.toggle('low',R.left<=60);}

function mockComment(pc){
  if(pc>=95)return 'Part 5 相当の精度は <b>900点圏</b> です。この速さを保ったまま、長文の処理量を増やす段階に入っています。';
  if(pc>=85)return '<b>850〜900点圏</b> の精度です。落とした分野を復習で潰せば、文法での失点はほぼなくなります。';
  if(pc>=70)return '<b>800点圏</b> です。900点帯との差は品詞・語法・一致の取りこぼしに出ます。弱点集中で該当ユニットを回しましょう。';
  return 'まずは間違えた問題の解説を読み直し、該当ユニットを一つずつ固めていきましょう。';}

/* ========== 復習 ========== */
function renderReview(){
  const b=$('#reviewBody');
  if(!S.wrong.length){
    b.innerHTML=`<div class="card"><div class="empty"><span class="big">◎</span>
      復習リストは空です。<br>演習で間違えた問題が自動でここに集まります。</div>
      <button class="btn" onclick="go('quiz')">演習に進む</button></div>`;return;
  }
  const byU={};S.wrong.forEach(w=>{(byU[w.u]=byU[w.u]||[]).push(w);});
  b.innerHTML=`<div class="card" style="margin-bottom:10px">
    <div style="font-weight:500;margin-bottom:4px">${S.wrong.length}問が復習待ちです</div>
    <div style="font-size:12.5px;color:var(--ink-2);line-height:1.8;margin-bottom:14px">
      2回連続で正解するとリストから外れます。1日1回まわすのが効率的です。</div>
    <button class="btn" onclick="startQuiz('review')">復習を始める</button></div>
  <div class="h2">内訳</div>
  ${Object.keys(byU).map(uid=>{const u=U(uid);
    return `<button class="unit" ${u.hidden?'':`onclick="openLesson('${uid}')"`}>
      <span class="no">${u.hidden?'--':String(VU.indexOf(u)+1).padStart(2,'0')}</span>
      <span class="body"><span class="t">${u.title}</span>
      <span class="s">${byU[uid].length}問が復習待ち${u.hidden?'':' ・ タップで解説を読む'}</span></span>
      <span style="font-family:var(--mono);font-size:17px;color:var(--wrong)">${byU[uid].length}</span>
    </button>`;}).join('')}
  <div style="height:10px"></div>
  <button class="btn ghost sm" onclick="clearWrong()">復習リストを空にする</button>`;
}
function clearWrong(){S.wrong=[];save();renderReview();renderLearn();toast('復習リストを空にしました');}

/* ========== 記録 ========== */
function streak(){
  let n=0;const d=new Date();
  for(;;){const k=d.toLocaleDateString('sv-SE');
    if(S.stats.days[k]){n++;d.setDate(d.getDate()-1);}
    else if(n===0&&k===today()){d.setDate(d.getDate()-1);}
    else break;
    if(n>999)break;}
  return n;
}
function renderStats(){
  const t=S.stats.total,c=S.stats.correct;
  const rate=t?Math.round(c/t*100):0;
  const doneUnits=VU.filter(u=>uStat(u.id).best>=80).length;
  $('#statsBody').innerHTML=`
  <div class="grid2" style="margin-bottom:9px">
    <div class="stat"><b>${streak()}</b><s>連続学習日数</s></div>
    <div class="stat"><b>${rate}<span style="font-size:15px">%</span></b><s>通算 正答率</s></div>
    <div class="stat"><b>${t}</b><s>解いた問題数</s></div>
    <div class="stat"><b>${doneUnits}<span style="font-size:15px">/${VU.length}</span></b><s>80%以上のユニット</s></div>
    <div class="stat"><b>${S.stats.mockBest||0}<span style="font-size:15px">%</span></b><s>模試 最高スコア</s></div>
    <div class="stat"><b>${S.wrong.length}</b><s>復習待ちの問題</s></div>
  </div>
  <div class="h2">ユニット別の到達度</div>
  <div class="card bars">${VU.map(u=>{const p=uStat(u.id).best;
    return `<div class="bar"><span class="lb">${u.title}</span>
      <span class="tr"><i style="width:${p}%;background:${p>=80?'#0F8C7E':'#2F4B99'}"></i></span>
      <span class="pc">${p?p+'%':'–'}</span></div>`;}).join('')}</div>
  <div class="h2">修了までの距離</div>
  <div class="card">${finishStatus()}</div>
  <div class="h2">つまずきの傾向</div>
  <div class="card"><div style="font-size:13px;line-height:1.9;color:var(--ink-2)">${advice()}</div></div>
  <div style="height:14px"></div>
  <button class="btn ghost sm" onclick="resetAll()">学習データをすべて消去する</button>
  <div style="height:10px"></div>`;
}
function finishStatus(){
  const need=VU.filter(u=>uStat(u.id).best<80);
  const mock=S.stats.mockBest||0;
  const spoken=S.units.sp&&S.units.sp.done, written=S.units.wr&&S.units.wr.done;
  if(!need.length&&mock>=90)
    return `<div style="text-align:center;padding:8px 0">
      <div style="font-family:var(--en);font-size:30px;font-weight:700;letter-spacing:-.02em">Complete</div>
      <div style="font-size:13px;line-height:1.9;color:var(--ink-2);margin-top:8px">
      全ユニット80%以上、模試90%以上を達成しました。ここまで来れば、TOEIC の文法問題で迷う場面はほとんど残っていません。
      あとは瞬間英作文を毎日回して、知識を速度に変える段階です。</div></div>`;
  const items=[
    ['全ユニットで80%以上',`残り ${need.length} ユニット`,need.length===0],
    ['模試で90%以上',`現在 ${mock}%`,mock>=90],
    ['復習リストを空にする',`残り ${S.wrong.length} 問`,S.wrong.length===0]];
  return `<div style="font-size:13px;line-height:1.9;color:var(--ink-2);margin-bottom:12px">
    次の3つがそろったら修了です。</div>
    <ul class="chk" style="margin:0">${items.map(([t,s,ok])=>
      `<li style="${ok?'color:var(--right)':''}">${t} — ${ok?'達成':s}</li>`).join('')}</ul>`;}

function advice(){
  if(!S.stats.total)return '演習を解くと、ここに苦手の傾向が表示されます。まずはユニット01から進めてみてください。';
  const cnt={main:0,sub:0,rel:0,word:0,out:0};
  S.wrong.forEach(w=>{const u=U(w.u);if(u)cnt[u.tag]++;});
  const name={main:'時制・態',sub:'接続表現・比較・助動詞',rel:'関係詞・分詞',word:'品詞・語法・一致',out:'会話・作文への応用'};
  const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  if(!cnt[top])return '今のところ復習待ちはありません。ミックス演習で定着を確認しましょう。';
  return `いま最も取りこぼしが多いのは <b>${name[top]}</b>（${cnt[top]}問）です。該当ユニットの解説を読み直してから復習を回すと、定着が早くなります。`;
}
function resetAll(){
  if(!confirm('学習データをすべて消去します。よろしいですか？'))return;
  S={units:{},wrong:[],stats:{total:0,correct:0,days:{}},last:null};save();renderStats();renderLearn();
  toast('学習データを消去しました');
}

/* ========== Service Worker ========== */
(function(){
  if(!('serviceWorker' in navigator))return;
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      reg.addEventListener('updatefound',()=>{
        const sw=reg.installing;if(!sw)return;
        sw.addEventListener('statechange',()=>{
          if(sw.state==='installed'&&navigator.serviceWorker.controller)
            toast('新しいバージョンがあります。開き直すと更新されます');
        });
      });
    }).catch(()=>{});
  });
})();

/* ========== boot ========== */
load().then(()=>{
  go('learn');
  const p=new URLSearchParams(location.search).get('go');
  if(p==='speak'||p==='mock'||p==='write'||p==='mix'||p==='review')
    setTimeout(()=>startQuiz(p),0);
});
</script>

</body>
</html>
